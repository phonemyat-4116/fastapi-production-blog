{% extends "layout.html" %}
{% block content %}
<article class="post post-detail">
    <img class="article-img" src="{{ post.author.image_path }}" 
        alt="{{ post.author.username }}'s profile picture" width="52" height="52" loading="lazy">
    <div class="post-body">
        <div class="article-metadata">
            <a class="article-author" href="{{ url_for('user_posts', user_id=post.author.id) }}">{{ post.author.username }}</a>
            <small class="article-date">{{ post.date_posted.strftime('%B %d, %Y') }}</small>
        </div>
        <h1 class="post-heading">{{ post.title }}</h1>
        <p class="article-content">{{ post.content }}</p>
        <!-- Only show edit/delete options if the user is the author -->
        <!-- TODO: Add user authentication and authorization -->
        <div class="post-actions d-flex flex-wrap gap-2 mt-4 pt-3 border-top">
            <a class="btn btn-outline-secondary" href="#">Edit Post</a>
            <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal"
                data-bs-target="#deleteModal">Delete Post</button>
        </div>
        <!-- TODO: Add user authentication and authorization -->
    </div>
</article>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">Delete Post?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <!-- TODO: <form action="#" method="post"> -->
            <form action="#">
                <div class="modal-body">Are you sure you want to delete this post? This action cannot be undone.</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-outline-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
