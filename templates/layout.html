<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Apply the saved theme before first paint to avoid a light/dark flash -->
    <script>
        (function () {
            var saved = localStorage.getItem('theme') || 'auto';
            var dark = saved === 'dark' ||
                (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
        })();
    </script>

    <!-- Site Info -->
    {% if title %}
    <title>FastAPI Blog - {{ title }}</title>
    {% else %}
    <title>FastAPI Blog</title>
    {% endif %}
    <meta name="description" content="FastAPI Tutorial">
    <meta name="author" content="Corey Schafer">

    <!-- Open Graph Tags: The title of the page for social media sharing. It can match the title tag or be more descriptive. -->
    <meta property="og:title" content="FastAPI Blog">

    <!-- Open Graph Tags: Typically set to "website" for static sites or "article" for content-heavy pages. -->
    <meta property="og:type" content="website">

    <!-- Open Graph Tags: The URL of the page, used to ensure link previews resolve to the correct page. -->
    <meta property="og:url" content="">

    <!-- Open Graph Tags: URL of an image that represents the page. Useful for link previews. -->
    <meta property="og:image" content="">

    <!-- Open Graph Tags: Provides an alternative text for the image to improve accessibility. -->
    <meta property="og:image:alt" content="">

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Custom Fonts: Bricolage Grotesque (headings, UI) + Literata (reading text) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Stylesheet -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', path='css/main.css') }}">

    <!-- Set a theme color that matches your website's primary color -->
    <meta name="theme-color" content="#0f172a">

    <!-- Favicon for all browsers -->
    <link rel="icon" href="{{ url_for('static', path='icons/favicon.ico') }}" sizes="any">
    <link rel="icon" href="{{ url_for('static', path='icons/icon.svg') }}" type="image/svg+xml">

    <!-- Apple touch icon for iOS devices -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='icons/icon.png') }}">
    <!-- Web app manifest for Progressive Web Apps -->
    <link rel="manifest" href="{{ url_for('static', path='site.webmanifest') }}">

    <!-- Content Security Policy: Uncomment to enhance security by restricting where content can be loaded from (useful for preventing certain attacks like XSS). Update if adding external sources (e.g., Google Fonts, Bootstrap CDN, analytics, etc). -->
    <!-- <meta http-equiv="Content-Security-Policy" content=" default-src 'self'; script-src 'self' code.jquery.com; style-src 'self' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' images.examplecdn.com; "> -->
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Navigation: a sticky top bar on small screens, a fixed left rail on large ones -->
    <header class="site-rail">
        <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
            <a class="navbar-brand brand" href="{{ url_for('home') }}">FastAPI Blog</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggle"
                aria-controls="navbarToggle" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarToggle">
                <div class="navbar-nav rail-nav">
                    <a class="nav-link active" aria-current="page" href="{{ url_for('home') }}">Home</a>
                </div>

                <!-- Rail bottom: account links + theme switcher -->
                <div class="rail-actions">
                    <div class="d-grid gap-2">
                        <a class="btn btn-outline-light" href="#">Login</a>
                        <a class="btn btn-light" href="#">Register</a>
                    </div>
                    <div class="navbar-nav">
                        <div class="nav-item dropup">
                            <a class="nav-link dropdown-toggle" href="#" role="button" id="bd-theme"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                <span id="bd-theme-text">🌗 Auto</span>
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="bd-theme">
                                <li>
                                    <button class="dropdown-item" type="button" data-bs-theme-value="light">🌝
                                        Light</button>
                                </li>
                                <li>
                                    <button class="dropdown-item" type="button" data-bs-theme-value="dark">🌚
                                        Dark</button>
                                </li>
                                <li>
                                    <button class="dropdown-item" type="button" data-bs-theme-value="auto">🌗
                                        Auto</button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="site-body d-flex flex-column flex-grow-1">
        <main role="main" class="page container-xxl flex-grow-1">
            <div class="row g-5">
                <div class="col-xl-8">
                    {% block content %}
                    {% endblock content %}
                </div>
                <aside class="col-xl-4">
                    <div class="sidebar-panel">
                        <h3>Our Sidebar</h3>
                        <p class="sidebar-note">You can put any information here you'd like.</p>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">Latest Posts</li>
                            <li class="list-group-item">Announcements</li>
                            <li class="list-group-item">Calendars</li>
                            <li class="list-group-item">etc</li>
                        </ul>
                    </div>
                </aside>
            </div>
        </main>

        <footer class="site-footer mt-auto">
            <div class="container-xxl">
                <p class="mb-0">© <span id="year"></span> Corey Schafer</p>
            </div>
        </footer>
    </div>

    <!-- Set the current year in the footer -->
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Dark Mode Toggle -->
    <script>
        const setTheme = (theme) => {
            if (theme === 'auto') {
                document.documentElement.setAttribute('data-bs-theme',
                    window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            } else {
                document.documentElement.setAttribute('data-bs-theme', theme);
            }
            localStorage.setItem('theme', theme);

            // Update button text
            const themeText = { light: '🌝 Light', dark: '🌚 Dark', auto: '🌗 Auto' };
            document.getElementById('bd-theme-text').textContent = themeText[theme];
        };

        // Set theme on click
        document.querySelectorAll('[data-bs-theme-value]').forEach(button => {
            button.addEventListener('click', () => setTheme(button.getAttribute('data-bs-theme-value')));
        });

        // Follow the OS setting live while "Auto" is selected
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if ((localStorage.getItem('theme') || 'auto') === 'auto') setTheme('auto');
        });

        // Initialize
        setTheme(localStorage.getItem('theme') || 'auto');
    </script>
</body>

</html>
